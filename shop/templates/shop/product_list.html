{% extends 'shop/base.html' %}

{% block title %}Catalog - Student Shop{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 text-center mb-4">
        <h1>Welcome to Student Shop</h1>
        <p class="text-muted">Browse items shared by fellow campus students!</p>
    </div>
</div>

<div class="row row-cols-1 row-cols-md-3 g-4">
    <!-- Placeholder card representing future dynamic backend data from Ima -->
    <div class="col">
        <div class="card h-100 shadow-sm">
            <svg class="bd-placeholder-img card-img-top" width="100%" height="200" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid slice">
                <rect width="100%" height="100%" fill="#dee2e6"></rect>
                <text x="50%" y="50%" fill="#6c757d" dy=".3em">Product Image</text>
            </svg>
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">Calculus Textbook (Example)</h5>
                <p class="card-text text-success fw-bold">$25.00</p>
                <p class="card-text text-muted small">Condition: Like New</p>
                <a href="#" class="btn btn-outline-primary mt-auto">View Details</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
